[package]
name = "andromeda-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local Android observation and control for MCP agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JeroTan/andromeda"
readme = "README.md"
default-run = "andromeda"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*", "docs/**", "examples/**"]

[lib]
name = "andromeda"

[[bin]]
name = "andromeda"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
quick-xml = { version = "0.38", features = ["serialize"] }
rmcp = { version = "3.6", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
rmcp = { version = "3.6", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["test-util", "process"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

