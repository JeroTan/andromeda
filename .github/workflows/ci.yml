name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: '1.88'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: cargo run --locked --release -- tools

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - name: Prepare bundled MCP executable
        run: node scripts/prepare-server.mjs
        env:
          TAURI_ENV_DEBUG: 'true'
      - run: cargo clippy --locked -p andromeda-desktop --all-targets -- -D warnings
      - name: Build desktop package
        run: npm run tauri build -- --debug --bundles ${{ matrix.bundle }}
      - name: Preserve package permissions
        shell: bash
        run: tar -czf ../target/desktop-preview.tar.gz -C ../target/debug bundle
      - uses: actions/upload-artifact@v4
        id: preview-upload
        continue-on-error: true
        with:
          name: desktop-preview-${{ runner.os }}
          path: target/desktop-preview.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Report unavailable preview download
        if: steps.preview-upload.outcome == 'failure'
        shell: bash
        run: printf '%s\n' 'The desktop package built successfully. Preview artifact upload failed; no CI download is available for this run. See the upload step for the storage or service error.' >> "$GITHUB_STEP_SUMMARY"

  android-companion:
    name: Android companion and emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android-companion/ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --prefix android-companion/ui
      - run: npm run format:check --prefix android-companion/ui
      - run: npm run build --prefix android-companion/ui
      - name: Install Android 37 compile platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build debug, release and UI test APKs
        run: android-companion/gradlew -p android-companion :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Check packaged resources and permissions
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          apk=pathlib.Path('android-companion/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as package:
              files=set(package.namelist())
          assert 'assets/main.lynx.bundle' in files, 'offline UI bundle missing'
          assert any(name.startswith('lib/arm64-v8a/') for name in files), 'arm64 runtime missing'
          assert any(name.startswith('lib/x86_64/') for name in files), 'emulator runtime missing'
          print('Offline UI bundle and Android runtimes are packaged.')
          PY
          aapt_tool="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt_tool" dump permissions android-companion/app/build/outputs/apk/debug/app-debug.apk > android-companion-permissions.txt
          if rg -q 'android.permission.INTERNET|android.permission.READ_EXTERNAL_STORAGE|android.permission.WRITE_EXTERNAL_STORAGE' android-companion-permissions.txt; then
            cat android-companion-permissions.txt
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: bash android-companion/ci/emulator-smoke.sh
      - name: Archive companion preview
        shell: bash
        run: tar -czf android-companion-preview.tar.gz -C android-companion/app/build/outputs/apk debug release
      - uses: actions/upload-artifact@v4
        id: phone-upload
        continue-on-error: true
        with:
          name: android-companion-preview
          path: android-companion-preview.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Report unavailable phone preview
        if: steps.phone-upload.outcome == 'failure'
        run: printf '%s\n' 'The APKs built and the emulator check passed. Artifact storage rejected the preview upload; see that step for details.' >> "$GITHUB_STEP_SUMMARY"

